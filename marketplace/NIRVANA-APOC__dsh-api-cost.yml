url: https://github.com/NIRVANA-APOC/dsh-api-cost
name: NIRVANA-APOC/dsh-api-cost
category: usage
description:
  en: 'Registers an apiCost session projection that estimates DeepSeek spend from reported token usage at published peak / off-peak rates, in CNY and USD, over self, delegation-tree or verified-team scopes: a composer-dock pill and its detail panel, an avoid-peak switch per conversation tree that parks that session''s and its delegated child sessions'' model requests until the cheap window, the /cost command, a session_cost tool, and GET routes for the view, the current rate card and the gate.'
  zh: '注册 apiCost 会话投影，按官方公布的峰谷价目表把上报的 token 用量折算成 ¥/$ 花费，覆盖本会话、委派树与经校验的团队三种范围：输入框下方的胶囊与其详情面板、按会话树生效的「避开高峰」开关（暂缓本会话及其子会话的模型请求到谷时）、/cost 命令、session_cost 工具，以及读取视图、当前价目表与开关状态的 GET 路由。'
